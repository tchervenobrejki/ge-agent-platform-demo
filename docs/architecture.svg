<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 690" width="1000" height="690" style="color:#1c2230" role="img" aria-label="The orchestrator on Agent Runtime runs triage, a parallel investigation over BigQuery, two RAG corpora and Google Search, a synthesizer that uses Memory Bank and GCS, then an action pipeline that asks the Compliance Agent over A2A and, after human approval, calls the remediation MCP server.">
        <rect x="0" y="0" width="1000" height="690" fill="#ffffff"/>
        <defs>
          <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" fill="#1c2230"/>
          </marker>
          <marker id="arr-w" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
            <path d="M0,0 L10,5 L0,10 z" style="fill: #c2410c"/>
          </marker>
        </defs>

        <!-- Runtime boundary -->
        <rect x="40" y="62" width="380" height="612" rx="10" fill="none" stroke="#1c2230" stroke-opacity="0.35" stroke-dasharray="5 4"/>
        <text x="60" y="644" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11.5" fill="#1c2230" fill-opacity="0.65">Every LLM step calls Gemini 3.5 Flash (europe-west3)</text>
        <text x="60" y="662" font-family="IBM Plex Sans Condensed, Arial Narrow, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#1c2230">Agent Runtime · growth_risk_orchestrator · Agent Identity</text>

        <!-- User -->
        <rect x="80" y="10" width="250" height="38" rx="6" style="fill: #eaedf2" stroke="#1c2230" stroke-opacity="0.5"/>
        <text x="205" y="34" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="13" fill="#1c2230">User · adk web · playground · API</text>
        <line x1="205" y1="48" x2="205" y2="78" stroke="#1c2230" marker-end="url(#arr)"/>

        <!-- Triage -->
        <rect x="80" y="80" width="250" height="46" rx="6" style="fill: #ffffff" stroke="#1c2230"/>
        <text x="96" y="99" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#1c2230">triage_agent</text>
        <text x="96" y="117" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#1c2230" fill-opacity="0.7">injection guard → triage_context</text>
        <line x1="205" y1="126" x2="205" y2="138" stroke="#1c2230" marker-end="url(#arr)"/>

        <!-- Parallel investigation -->
        <rect x="60" y="140" width="290" height="250" rx="8" style="fill: #eaedf2" stroke="#1c2230" stroke-opacity="0.35"/>
        <text x="74" y="157" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#1c2230" fill-opacity="0.75">parallel_investigation · ParallelAgent</text>

        <rect x="80" y="166" width="250" height="44" rx="6" style="fill: #ffffff" stroke="#1c2230"/>
        <text x="96" y="184" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#1c2230">metrics_branch</text>
        <text x="96" y="201" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#1c2230" fill-opacity="0.7">SQL loop (≤3 tries) → KPIs</text>

        <rect x="80" y="220" width="250" height="44" rx="6" style="fill: #ffffff" stroke="#1c2230"/>
        <text x="96" y="238" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#1c2230">feedback_agent</text>
        <text x="96" y="255" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#1c2230" fill-opacity="0.7">→ feedback_findings</text>

        <rect x="80" y="274" width="250" height="44" rx="6" style="fill: #ffffff" stroke="#1c2230"/>
        <text x="96" y="292" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#1c2230">policy_agent</text>
        <text x="96" y="309" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#1c2230" fill-opacity="0.7">→ policy_findings</text>

        <rect x="80" y="328" width="250" height="44" rx="6" style="fill: #ffffff" stroke="#1c2230"/>
        <text x="96" y="346" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#1c2230">external_signal_agent</text>
        <text x="96" y="363" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#1c2230" fill-opacity="0.7">→ external_signal_findings</text>

        <line x1="205" y1="390" x2="205" y2="408" stroke="#1c2230" marker-end="url(#arr)"/>

        <!-- Synthesizer -->
        <rect x="80" y="410" width="250" height="44" rx="6" style="fill: #ffffff" stroke="#1c2230"/>
        <text x="96" y="428" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#1c2230">synthesizer_agent</text>
        <text x="96" y="445" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#1c2230" fill-opacity="0.7">report + one primary action</text>
        <line x1="205" y1="454" x2="205" y2="470" stroke="#1c2230" marker-end="url(#arr)"/>

        <!-- Action pipeline -->
        <rect x="60" y="472" width="290" height="150" rx="8" style="fill: #eaedf2" stroke="#1c2230" stroke-opacity="0.35"/>
        <text x="74" y="489" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="11" fill="#1c2230" fill-opacity="0.75">action_pipeline · SequentialAgent</text>

        <rect x="80" y="496" width="250" height="44" rx="6" style="fill: #ffffff" stroke="#1c2230"/>
        <text x="96" y="514" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#1c2230">compliance_agent</text>
        <text x="96" y="531" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#1c2230" fill-opacity="0.7">RemoteA2aAgent → compliance_result</text>
        <line x1="205" y1="540" x2="205" y2="558" stroke="#1c2230" marker-end="url(#arr)"/>

        <rect x="80" y="560" width="250" height="44" rx="6" style="fill: #ffffff; stroke: #c2410c" stroke-width="1.5"/>
        <text x="96" y="578" font-family="IBM Plex Mono, Menlo, Consolas, monospace" font-size="13" fill="#1c2230">remediation_agent</text>
        <text x="96" y="595" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#1c2230" fill-opacity="0.7">McpToolset · require_confirmation</text>

        <!-- Resources -->
        <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif">
          <rect x="640" y="166" width="300" height="44" rx="6" style="fill: #eaedf2" stroke="#1c2230" stroke-opacity="0.6"/>
          <text x="656" y="184" font-size="13" font-weight="500" fill="#1c2230">BigQuery · demo_growth</text>
          <text x="656" y="201" font-size="11" fill="#1c2230" fill-opacity="0.7">campaign_daily · funnel_daily</text>

          <rect x="640" y="220" width="300" height="44" rx="6" style="fill: #eaedf2" stroke="#1c2230" stroke-opacity="0.6"/>
          <text x="656" y="238" font-size="13" font-weight="500" fill="#1c2230">RAG Engine · support corpus</text>
          <text x="656" y="255" font-size="11" fill="#1c2230" fill-opacity="0.7">checkout_runbook.md</text>

          <rect x="640" y="274" width="300" height="44" rx="6" style="fill: #eaedf2" stroke="#1c2230" stroke-opacity="0.6"/>
          <text x="656" y="292" font-size="13" font-weight="500" fill="#1c2230">RAG Engine · policy corpus</text>
          <text x="656" y="309" font-size="11" fill="#1c2230" fill-opacity="0.7">campaign_operations.md</text>

          <rect x="640" y="328" width="300" height="44" rx="6" style="fill: #eaedf2" stroke="#1c2230" stroke-opacity="0.6"/>
          <text x="656" y="346" font-size="13" font-weight="500" fill="#1c2230">Google Search</text>
          <text x="656" y="363" font-size="11" fill="#1c2230" fill-opacity="0.7">live outage and status signals</text>

          <rect x="640" y="410" width="300" height="44" rx="6" style="fill: #eaedf2" stroke="#1c2230" stroke-opacity="0.6"/>
          <text x="656" y="428" font-size="13" font-weight="500" fill="#1c2230">Memory Bank · GCS bucket</text>
          <text x="656" y="445" font-size="11" fill="#1c2230" fill-opacity="0.7">past investigations · report artifact</text>

          <rect x="640" y="496" width="300" height="44" rx="6" style="fill: #eaedf2" stroke="#1c2230" stroke-opacity="0.6"/>
          <text x="656" y="514" font-size="13" font-weight="500" fill="#1c2230">Compliance Agent · Cloud Run</text>
          <text x="656" y="531" font-size="11" fill="#1c2230" fill-opacity="0.7">check_action_compliance · private</text>

          <rect x="640" y="560" width="300" height="44" rx="6" style="fill: #fbe9df; stroke: #c2410c" stroke-width="1.5"/>
          <text x="656" y="578" font-size="13" font-weight="500" fill="#1c2230">Remediation MCP server · Cloud Run</text>
          <text x="656" y="595" font-size="11" fill="#1c2230" fill-opacity="0.7">create_remediation_action_mcp · private</text>
        </g>

        <!-- Read edges -->
        <g font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" fill="#1c2230">
          <line x1="330" y1="188" x2="636" y2="188" stroke="#1c2230" marker-end="url(#arr)"/>
          <text x="485" y="181" text-anchor="middle">read-only SELECT</text>
          <line x1="330" y1="242" x2="636" y2="242" stroke="#1c2230" marker-end="url(#arr)"/>
          <text x="485" y="235" text-anchor="middle">search_support_docs</text>
          <line x1="330" y1="296" x2="636" y2="296" stroke="#1c2230" marker-end="url(#arr)"/>
          <text x="485" y="289" text-anchor="middle">search_policy_docs</text>
          <line x1="330" y1="350" x2="636" y2="350" stroke="#1c2230" marker-end="url(#arr)"/>
          <text x="485" y="343" text-anchor="middle">google_search grounding</text>
          <line x1="330" y1="432" x2="636" y2="432" stroke="#1c2230" marker-start="url(#arr)" marker-end="url(#arr)"/>
          <text x="485" y="425" text-anchor="middle">recall · save report</text>
          <line x1="330" y1="518" x2="636" y2="518" stroke="#1c2230" marker-start="url(#arr)" marker-end="url(#arr)"/>
          <text x="485" y="511" text-anchor="middle">A2A message/send ⇄ decision</text>
        </g>

        <!-- Write path -->
        <rect x="438" y="562" width="120" height="40" rx="20" style="fill: #ffffff; stroke: #c2410c" stroke-width="1.5"/>
        <text x="498" y="586" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" style="fill: #c2410c">Human approval</text>
        <line x1="330" y1="582" x2="434" y2="582" style="stroke: #c2410c" stroke-width="1.5" marker-end="url(#arr-w)"/>
        <text x="382" y="575" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" style="fill: #c2410c">proposes</text>
        <line x1="558" y1="582" x2="636" y2="582" style="stroke: #c2410c" stroke-width="1.5" marker-end="url(#arr-w)"/>
        <text x="597" y="575" text-anchor="middle" font-family="IBM Plex Sans, Helvetica, Arial, sans-serif" font-size="11" style="fill: #c2410c">tools/call</text>
      </svg>
