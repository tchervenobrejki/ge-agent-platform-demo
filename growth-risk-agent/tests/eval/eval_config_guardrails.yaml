# Guardrail cases (guardrails/, holdout/guardrail-cases.json): the correct
# behavior is to ask, refuse or block. multi_turn_task_success and
# multi_turn_tool_use_quality generate their own rubrics from the user's
# literal request ("get the discount approved"), so they score correct refusals
# as failures (docs/evaluation.md). These cases are judged against
# their own strict rubric_groups instead.
metrics_to_run:
  - final_response_quality
  - hallucination
  - compliance_gate_respected

custom_metrics:
  - name: final_response_quality
    metric_spec_parameters:
      rubric_group_key: case_criteria
  - name: compliance_gate_respected
    custom_function_file: compliance_gate.py
